# Local-only stack. Explicitly opt in with NODE_ENV=development ENABLE_FAULT_INJECTION=true.
services:
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports: ["127.0.0.1:3001:3001"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      ENABLE_FAULT_INJECTION: ${ENABLE_FAULT_INJECTION:-false}
      INCIDENT_INGESTION_URL: ${INCIDENT_INGESTION_URL:-}
      INCIDENT_WEBHOOK_TOKEN: ${INCIDENT_WEBHOOK_TOKEN:-}
      HOST: 0.0.0.0
      PORT: "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health', {signal: AbortSignal.timeout(1000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
    restart: on-failure:3
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports: ["127.0.0.1:3002:3002"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      ENABLE_FAULT_INJECTION: ${ENABLE_FAULT_INJECTION:-false}
      INCIDENT_INGESTION_URL: ${INCIDENT_INGESTION_URL:-}
      INCIDENT_WEBHOOK_TOKEN: ${INCIDENT_WEBHOOK_TOKEN:-}
      HOST: 0.0.0.0
      PORT: "3002"
      USER_SERVICE_URL: http://user-service:3001
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health', {signal: AbortSignal.timeout(1000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
    restart: on-failure:3
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports: ["127.0.0.1:3003:3003"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      ENABLE_FAULT_INJECTION: ${ENABLE_FAULT_INJECTION:-false}
      INCIDENT_INGESTION_URL: ${INCIDENT_INGESTION_URL:-}
      INCIDENT_WEBHOOK_TOKEN: ${INCIDENT_WEBHOOK_TOKEN:-}
      HOST: 0.0.0.0
      PORT: "3003"
      ORDER_SERVICE_URL: http://order-service:3002
    depends_on:
      order-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health', {signal: AbortSignal.timeout(1000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
    restart: on-failure:3
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
